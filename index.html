  <!-- ═══ Preloader styles — inline so they render before React ═══ -->
  <script>
    (function () {
      try {
        var m = JSON.parse(localStorage.getItem('theme-storage') || '{}').state;
        document.documentElement.setAttribute('data-theme', (m && m.mode) || 'light');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <style>
    #preloader {
      --pl-bg: #FAFAF9; --pl-fg: #1C1917; --pl-muted: #78716C; --pl-red: #B42318; --pl-track: #E7E5E4;
      position: fixed; inset: 0; z-index: 9999; background: var(--pl-bg); color: var(--pl-fg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      font-family: "Inter", "Noto Sans Kannada", system-ui, sans-serif; text-align: center; padding: 24px;
    }
    [data-theme="dark"] #preloader { --pl-bg: #0C0A09; --pl-fg: #FAFAF9; --pl-muted: #A8A29E; --pl-red: #F04438; --pl-track: #292524; }
    #preloader.exit { animation: plExit .45s ease forwards }
    @keyframes plExit { to { opacity: 0; visibility: hidden } }
    .pl-logo { width: 64px; height: 64px; border-radius: 14px; animation: plIn .4s ease both }
    .pl-words { position: relative; height: 56px; min-width: 260px }
    .pl-old, .pl-new { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: "Noto Sans Kannada", "Inter", sans-serif; font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: -0.01em }
    .pl-old { color: var(--pl-muted); animation: plIn .35s ease .15s both, plOut .3s ease 1.05s forwards }
    .pl-old > span { position: relative }
    .pl-old > span::after { content: ""; position: absolute; left: -4px; right: -4px; top: 52%; height: 3px; background: var(--pl-red);
      transform: scaleX(0); transform-origin: left; animation: plStrike .35s ease .6s forwards }
    .pl-new { opacity: 0; animation: plIn .4s ease 1.2s forwards }
    .pl-sub { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--pl-muted); opacity: 0; animation: plIn .4s ease 1.35s forwards }
    .pl-art { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-size: 13px; font-weight: 500; color: var(--pl-muted); opacity: 0; animation: plIn .4s ease 1.5s forwards }
    .pl-art b { color: var(--pl-red); font-weight: 700 }
    .pl-progress { width: 120px; height: 2px; border-radius: 2px; background: var(--pl-track); overflow: hidden; margin-top: 8px }
    .pl-progress span { display: block; height: 100%; width: 100%; background: var(--pl-red); transform: scaleX(0); transform-origin: left; animation: plFill 2.2s cubic-bezier(.4,0,.2,1) forwards }
    @keyframes plIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    @keyframes plOut { to { opacity: 0; transform: translateY(-6px) } }
    @keyframes plStrike { to { transform: scaleX(1) } }
    @keyframes plFill { to { transform: scaleX(1) } }
    @media (prefers-reduced-motion: reduce) {
      #preloader *, #preloader *::after { animation-duration: .01ms !important; animation-delay: 0s !important }
      .pl-old { display: none }
    }
  </style>
  <!-- ═══ Path-based Preloader Toggle ═══ -->
  <style id="preloader-hide-style">
    #preloader { display: none !important; }
  </style>
  <script>
    (function () {
      var path = window.location.pathname;
      // Show preloader only on root or explicit loading page
      if (path === '/' || path === '/index.html' || path === '/loading') {
        var style = document.getElementById('preloader-hide-style');
        if (style) style.remove();
      }
    })();
  </script>
</head>

<body>
  <!-- ═══ Preloader — renders instantly before React loads ═══ -->

        var d = t[lang];
        if (!d) return; // English is the default in HTML
        var s = function (id, v) { var e = document.getElementById(id); if (e) e.textContent = v; };
