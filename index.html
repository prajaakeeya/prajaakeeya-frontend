  <!-- ═══ Preloader styles — inline so they load before React ═══ -->
  <style>
    html, body {
      background-color: #FFFFFF !important;
    }
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #FFFFFF !important; /* Force Pure White Background */
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #preloader.exit {
      animation: plExit .5s ease forwards;
    }
    @keyframes plExit {
      to { opacity: 0; transform: scale(1.05); }
    }

    /* Orbital Energy Rings */
    .pl-orbital-wrap {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pl-ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
      animation: plSpin linear infinite;
    }
    .pl-ring-1 {
      width: 100%; height: 100%;
      border-top-color: #C8180A;
      border-left-color: rgba(200, 24, 10, 0.1);
      animation-duration: 1.5s; /* FAST */
    }
    .pl-ring-2 {
      width: 80%; height: 80%;
      border-right-color: #F5A800;
      border-bottom-color: rgba(245, 168, 0, 0.1);
      animation-duration: 1s; /* FAST */
      animation-direction: reverse;
    }
    .pl-ring-3 {
      width: 60%; height: 60%;
      border-top-color: #E02010;
      border-bottom-color: rgba(224, 32, 16, 0.1);
      animation-duration: 2s; /* FAST */
    }

    @keyframes plSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Glowing Core / Logo */
    .pl-core {
      position: relative;
      z-index: 10;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08), inset 0 0 20px rgba(0, 0, 0, 0.05);
      animation: plCorePulse 1s ease-in-out infinite alternate;
    }
    @keyframes plCorePulse {
      0% { box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05), inset 0 0 10px rgba(0, 0, 0, 0.02); transform: scale(1); }
      100% { box-shadow: 0 15px 50px rgba(0, 0, 0, 0.12), inset 0 0 30px rgba(0, 0, 0, 0.05); transform: scale(1.05); }
    }
    .pl-logo-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: contain;
      display: block;
    }

    /* Text Reveal */
    .pl-text-wrap {
      position: absolute;
      top: 68%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      /* removed opacity: 0 and animation to show instantly */
    }
    
    .pl-title-kn {
      font-family: 'Tiro Kannada', serif;
      font-size: clamp(16px, 3.5vw, 32px);
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: -4px;
      background: linear-gradient(135deg, #E02010, #F5A800, #FFCB00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }
    .pl-title {
      font-family: 'Baloo 2', cursive;
      font-size: clamp(24px, 5vw, 42px);
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #E02010, #F5A800, #FFCB00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }
    
    .pl-art-row {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .pl-art-word {
      font-family: 'Mukta', sans-serif;
      font-size: clamp(10px, 1.5vw, 14px);
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(15, 23, 42, 0.8) !important; /* Force dark grey so Vite CSS doesn't make it white */
      text-transform: uppercase;
    }
    .pl-art-word span {
      color: #E02010 !important;
      font-size: 1.3em;
      font-weight: 900;
    }

    /* removed plFadeIn keyframes */

    /* Progress Bar */
    @keyframes plFadeInCenter {
      from { opacity: 0; transform: translateX(-50%) translateY(15px); filter: blur(3px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); filter: blur(0); }
    }
    .pl-progress-wrap {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 250px;
      height: 3px;
      background: rgba(15, 23, 42, 0.1);
      border-radius: 3px;
      overflow: hidden;
      opacity: 0;
      animation: plFadeInCenter 0.4s 0.3s ease forwards;
    }
    .pl-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #C8180A, #F5A800);
      box-shadow: 0 0 10px rgba(245, 168, 0, 0.5);
      animation: plProgressFill 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes plProgressFill {
      0% { width: 0%; }
      40% { width: 45%; }
      80% { width: 85%; }
      100% { width: 100%; }
    }

  </style>
  <!-- ═══ Path-based Preloader Toggle ═══ -->
  <style id="preloader-hide-style">
    #preloader { display: none !important; }
  </style>
  <script>
    (function () {
      var path = window.location.pathname;
      // Show preloader only on root or explicit loading page
      if (path === '/' || path === '/index.html' || path === '/loading') {
        var style = document.getElementById('preloader-hide-style');
        if (style) style.remove();
      }
    })();
  </script>
</head>

<body>
  <!-- ═══ Preloader — renders instantly before React loads ═══ -->
  <div id="preloader">
    <div class="pl-orbital-wrap">
      <div class="pl-ring pl-ring-1"></div>
      <div class="pl-ring pl-ring-2"></div>
      <div class="pl-ring pl-ring-3"></div>
      <div class="pl-core">
        <img class="pl-logo-img" src="/prajakeeya.png" alt="Prajaakeeya Logo" />
      </div>
    </div>

    <div class="pl-text-wrap">
      <div class="pl-title-kn" id="pl-title-kn">ದಿ ರಿಯಲ್ ಪ್ರಜಾಕೀಯ</div>
      <div class="pl-title" id="pl-title">THE REAL PRAJAAKEEYA</div>
      <div class="pl-art-row">
        <div class="pl-art-word" id="pl-art-a"><span>A</span>CCOUNTABILITY (ಹೊಣೆಗಾರಿಕೆ)</div>
        <div class="pl-art-word" id="pl-art-r"><span>R</span>ESPONSIBILITY (ಜವಾಬ್ದಾರಿ)</div>
        <div class="pl-art-word" id="pl-art-t"><span>T</span>RANSPARENCY (ಪಾರದರ್ಶಕತೆ)</div>
      </div>
    </div>

    <div class="pl-progress-wrap">
      <div class="pl-progress-fill"></div>
    </div>

    <script>
      (function () {
        // We ensure the language translations are updated instantly if stored
        var t = {
          kn: { title: 'ದಿ ರಿಯಲ್ ಪ್ರಜಾಕೀಯ', a: 'ಹೊಣೆಗಾರಿಕೆ', r: 'ಜವಾಬ್ದಾರಿ', t: 'ಪಾರದರ್ಶಕತೆ' },
          hi: { title: 'दि रियल प्रजाकीय', a: 'जवाबदेही', r: 'जिम्मेदारी', t: 'पारदर्शिता' },
          te: { title: 'ది రియల్ ప్రజాకీయ', a: 'జవాబుదారీతనం', r: 'బాధ్యత', t: 'పారదర్శకత' },
          ta: { title: 'தி ரியல் பிரஜாகீய', a: 'பொறுப்புணர்வு', r: 'பொறுப்பு', t: 'வெளிப்படைத்தன்மை' },
          bn: { title: 'দি রিয়েল প্রজাকীয়', a: 'জবাবদিহিতা', r: 'দায়িত্ব', t: 'স্বচ্ছতা' },
          mr: { title: 'दि रियल प्रजाकीय', a: 'उत्तरदायित्व', r: 'जबाबदारी', t: 'पारदर्शकता' },
          gj: { title: 'ધ રિયલ પ્રજાકીય', a: 'જવાબદારી', r: 'જવાબદારી', t: 'પારદર્શિતા' },
          ma: { title: 'ദി റിയൽ പ്രജാകീയ', a: 'ഉത്തരവാദിത്തം', r: 'ഉത്തരവാദിത്വം', t: 'സുതാര്യത' },
          od: { title: 'ଦି ରିଅଲ୍ ପ୍ରଜାକୀୟ', a: 'ଦାୟିତ୍ୱ', r: 'ଉତ୍ତରଦାୟିତ୍ୱ', t: 'ସ୍ୱଚ୍ଛତା' }
        };
        var lang = (localStorage.getItem('i18nextLng') || 'en').split('-')[0];
        
        // If it's English, we show English with Kannada in brackets (Default)
        // If it's a specific regional language, we translate fully
        if (lang !== 'en' && t[lang]) {
          var d = t[lang];
          var s = function (id, html) { var e = document.getElementById(id); if (e) e.innerHTML = html; };
          s('pl-title', d.title);
          s('pl-art-a', '<span>A</span>CCOUNTABILITY (' + d.a + ')');
          s('pl-art-r', '<span>R</span>ESPONSIBILITY (' + d.r + ')');
          s('pl-art-t', '<span>T</span>RANSPARENCY (' + d.t + ')');
        }
      })();
    </script>
  </div><!-- /#preloader -->

  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
